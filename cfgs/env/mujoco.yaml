# @package env
_target_: sb3.env_factory.create_mujoco_env
env_id: "HalfCheetah-v5"
n_envs: 1
render_mode: "rgb_array"
seed: ${training.seed} # Use seed from algo config

# VecNormalize (running obs / discounted-return normalization); off by default so
# baselines are unchanged. Per-env BPO defaults come from algo.per_env; force with env.normalize=true|false
normalize: ${oc.select:algo.per_env.${env.env_id}.normalize,false}
norm_obs: ${oc.select:algo.per_env.${env.env_id}.norm_obs,true}
norm_reward: ${oc.select:algo.per_env.${env.env_id}.norm_reward,true}
norm_gamma: ${oc.select:algo.gamma,0.99}
