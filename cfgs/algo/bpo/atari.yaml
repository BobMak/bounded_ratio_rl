# @package algo
_convert_: all
_target_: sb3.BPO
policy: BPOCnnPolicy
policy_kwargs:
  ortho_init: true
  activation_fn:
    _target_: hydra.utils.get_class
    path: torch.nn.ReLU
  net_arch:
    pi: [256]
    vf: [256]
  share_features_extractor: True

learning_rate: 0.0003
# learning_rate:
#   _target_: utils.linear_schedule
#   initial_value: 0003

batch_size: 128
n_steps: 2048
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
lambda_: 0.001
ent_coef: 0.0
vf_coef: 0.5
u_coef: 0.5
clip_ratio: 0.3
verbose: 1
max_grad_norm: 1.0
use_median: True
# adaptive ratio bound: adapt clip_ratio so per-update exact KL(old||new) tracks clip_target_kl
adaptive_clip: False
clip_target_kl: 0.02
clip_adapt_rate: 0.5
# clip_mode: target = track clip_target_kl; climb = +clip_climb_step per update, x clip_cut when
# KL > clip_kl_ceiling or KL > clip_spike_ratio * median(last clip_window), then hold clip_cooldown
clip_mode: target
clip_climb_step: 0.03
clip_cut: 0.7
clip_kl_ceiling: 0.5
clip_spike_ratio: 1.5
clip_window: 5
clip_cooldown: 3
# spike test on KL / eps**clip_kl_power (0 = raw KL); climb-only extras below
clip_kl_power: 2.0
clip_momentum: 0.0
clip_noise: 0.0
clip_rollback: False
clip_min: 0.02
clip_max: 0.9
# controlled-eps variant: normalized |Q-V| policy weight + separate actor/critic grad clipping
controlled_eps: False
# per-state ratio bound from the exact per-state KL(pi_old(s) || pi_theta(s)) during the update:
#   null  - off
#   mask  - drop a state from the policy loss once its KL exceeds state_kl_max
#   scale - shrink that state's eps to eps * min(1, sqrt(state_kl_max / KL_s))
state_clip: null
state_kl_max: 0.05
