# Configuration for a wandb sweep
# Running the following command under the hood:

program: train_rsl_rl.py
description: "ppo training with random seeds"
name: PPO_anymal_rough_random_seeds
method: grid
metric:
  goal: maximize
  name: Train/mean_reward
parameters:
  agent.seed:
    values: [1, 2, 3, 4, 5]

command:
  - python
  - ${program}
  - "--headless"
  - "--task=Isaac-Velocity-Rough-Anymal-C-v0"
  - "--algorithm=ppo"
  - "--logger=wandb"
  - ${args_no_hyphens}
